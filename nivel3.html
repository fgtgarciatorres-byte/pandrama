<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NIVEL 3 — El Dragón</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none;}
#info{color:#f60;font:bold 11px monospace;padding:4px;background:#0a0010;width:100%;text-align:center;}
canvas{display:block;image-rendering:pixelated;}
</style>
</head>
<body>
<div id="info">NIVEL 3 — El Dragón | Arrastra para moverte</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const BASE_W=390,BASE_H=680;let scale=1;
function resize(){const ih=window.innerHeight-24;scale=Math.min(window.innerWidth/BASE_W,ih/BASE_H);C.style.width=(BASE_W*scale)+'px';C.style.height=(BASE_H*scale)+'px';C.width=BASE_W;C.height=BASE_H;}
resize();window.addEventListener('resize',resize);
const W=BASE_W,H=BASE_H;

const RAW='https://raw.githubusercontent.com/fgtgarciatorres-byte/pandrama/main/';
const IMGS={};
function loadImg(k,p){const i=new Image();i.crossOrigin='anonymous';i.src=RAW+p;IMGS[k]=i;}
loadImg('bg','assets/bg/cyberpunk.png');
loadImg('pan','assets/sprites/panificador_run.png');

const T={x:0,y:0,down:false};let _jd=false;
function gp(e,i=0){const r=C.getBoundingClientRect(),s=e.changedTouches?e.changedTouches[i]:e;return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=gp(e);T.x=p.x;T.y=p.y;T.down=true;_jd=true;},{passive:false});
C.addEventListener('touchend',  e=>{e.preventDefault();T.down=false;},{passive:false});
C.addEventListener('touchmove', e=>{e.preventDefault();const p=gp(e);T.x=p.x;T.y=p.y;},{passive:false});
C.addEventListener('mousedown', e=>{const p=gp(e);T.x=p.x;T.y=p.y;T.down=true;_jd=true;});
C.addEventListener('mouseup',   ()=>T.down=false);
C.addEventListener('mousemove', e=>{if(T.down){const p=gp(e);T.x=p.x;T.y=p.y;}});
function dn(x,y,w,h){return T.down&&T.x>=x&&T.x<=x+w&&T.y>=y&&T.y<=y+h;}

function fr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function sr(x,y,w,h,c,lw=1.5){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}
function txt(s,x,y,sz,c,al='left'){ctx.font=`bold ${sz}px monospace`;ctx.fillStyle=c;ctx.textAlign=al;ctx.fillText(s,x,y);}
function txts(s,x,y,sz,c,sh='#000'){ctx.font=`bold ${sz}px monospace`;ctx.textAlign='center';ctx.fillStyle=sh;ctx.fillText(s,x+2,y+2);ctx.fillStyle=c;ctx.fillText(s,x,y);}
function bar(x,y,w,h,v,mx,c,bg='#1a1a1a'){ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);ctx.fillStyle=c;ctx.fillRect(x+1,y+1,Math.max(0,Math.floor((w-2)*v/mx)),h-2);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);}
function btn(x,y,w,h,lbl,bg='#223'){ctx.fillStyle='#000';ctx.fillRect(x+2,y+2,w,h);ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);ctx.font='bold 12px monospace';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(lbl,x+w/2,y+h/2+5);}

function drawBread(x,y,sz=9){ctx.fillStyle='#b87010';ctx.beginPath();ctx.ellipse(x,y,sz,sz*.48,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8900a';ctx.beginPath();ctx.ellipse(x,y-1,sz*.65,sz*.28,0,0,Math.PI*2);ctx.fill();}

// Dragon
function drawDragon(x,y,fr_,sh,shMax){
  const t=fr_*.12,bob=Math.sin(t)*8;
  // Wings
  for(const s of[-1,1]){
    ctx.save();ctx.translate(x,y);ctx.scale(s,1);
    ctx.fillStyle='rgba(40,15,0,0.88)';ctx.beginPath();
    ctx.moveTo(0,bob);ctx.quadraticCurveTo(68,-48+Math.sin(t+1)*18+bob,92,16+bob);
    ctx.quadraticCurveTo(58,36+bob,0,24+bob);ctx.closePath();ctx.fill();
    // Wing membrane veins
    ctx.strokeStyle='rgba(80,30,0,0.4)';ctx.lineWidth=1;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,8+bob+i*6);ctx.quadraticCurveTo(44,-20+i*12+bob,75,8+i*10+bob);ctx.stroke();}
    ctx.restore();
  }
  ctx.save();ctx.translate(x,y);
  // Body glow
  ctx.shadowColor='#1a8a18';ctx.shadowBlur=18;
  ctx.fillStyle='#1a5c18';ctx.beginPath();ctx.ellipse(0,14+bob,36,24,0,0,Math.PI*2);ctx.fill();
  fr(-10,-14+bob,20,30,'#1a5c18');
  ctx.fillStyle='#1a5c18';ctx.beginPath();ctx.ellipse(0,-28+bob,24,18,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Scales
  ctx.fillStyle='#2a7a28';
  for(let i=0;i<5;i++) ctx.beginPath(),ctx.ellipse(-6+i*3,10+bob+i*4,4,3,0,0,Math.PI*2),ctx.fill();
  // Snout
  fr(-10,-22+bob,20,11,'#2a7a28');
  ctx.fillStyle='#1a5018';ctx.beginPath();ctx.arc(0,-26+bob,4,0,Math.PI*2);ctx.fill();
  // Eyes (glowing)
  for(const [ex,ey] of[[-10,-32],[ 10,-32]]){
    ctx.fillStyle='#ff2200';ctx.shadowColor='#ff2200';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(ex,ey+bob,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffee00';ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(ex+1,ey+bob,3,0,Math.PI*2);ctx.fill();
  }
  // Rider (MariDragones silhouette)
  fr(-14,-10+bob,28,20,'#7a4820');fr(-10,-16+bob,20,8,'#9a6840');
  ctx.fillStyle='#c8956e';ctx.beginPath();ctx.arc(0,-24+bob,10,0,Math.PI*2);ctx.fill();
  // Shield
  if(sh>0){
    const a=sh/shMax;
    ctx.strokeStyle=`rgba(80,160,255,${a*.9})`;ctx.lineWidth=5;
    ctx.beginPath();ctx.ellipse(0,0+bob,62,72,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=`rgba(160,220,255,${a*.35})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0+bob,55,65,0,0,Math.PI*2);ctx.stroke();
    // Shield sparkles
    if(frame%8<4){for(let i=0;i<4;i++){const ang=frame*.1+i*Math.PI/2;ctx.fillStyle=`rgba(150,200,255,${a*.6})`;ctx.beginPath();ctx.arc(Math.cos(ang)*60,Math.sin(ang)*70+bob,3,0,Math.PI*2);ctx.fill();}}
  }
  ctx.restore();
}

// Player
function drawPan(x,y,fr_,shield=false){
  const img=IMGS.pan;
  ctx.save();ctx.translate(x,y);
  if(shield){ctx.shadowColor='#4af';ctx.shadowBlur=14;}
  if(img&&img.complete&&img.naturalWidth>0){
    const frames=6,fw=img.width/frames,frame=fr_%frames|0;
    ctx.drawImage(img,frame*fw,0,fw,img.height/2,-22,-24,44,56);
  } else {
    const t=fr_*.25,bob=Math.sin(t)*2;
    ctx.fillStyle='#1a8fff';ctx.beginPath();ctx.moveTo(6,6+bob);ctx.lineTo(-4,28+bob);ctx.lineTo(18,20+bob);ctx.closePath();ctx.fill();
    fr(-11,3+bob,28,22,'#1144bb');fr(-4,7+bob,9,5,'#ffd700');
    fr(-8,-11+bob,22,16,'#c8956e');fr(-8,-11+bob,22,6,'#1a0800');
    const ls=Math.sin(t)*5;fr(-9,25+bob,10,16,'#0033aa');fr(4,25+bob-ls,10,16,'#0033aa');
    fr(-16,6+bob,8,16,'#c8956e');fr(16,6+bob,8,16,'#c8956e');
    if(shield){ctx.strokeStyle='rgba(80,180,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(3,15+bob,24,32,0,0,Math.PI*2);ctx.stroke();}
  }
  ctx.shadowBlur=0;ctx.restore();
}

// FX
let FX=[];
function addFX(x,y,type){FX.push({x,y,type,t:0,max:type==='expl'?25:38});}
function updateFX(){FX=FX.filter(e=>(e.t++)<e.max);}
function drawFX(){
  FX.forEach(e=>{
    const p=e.t/e.max;ctx.globalAlpha=(1-p)*.9;
    if(e.type==='hit'){ctx.strokeStyle='#f80';ctx.lineWidth=3;for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*8,e.y+Math.sin(a)*8);ctx.lineTo(e.x+Math.cos(a)*p*50,e.y+Math.sin(a)*p*50);ctx.stroke();}}
    else if(e.type==='expl'){ctx.fillStyle=`rgba(255,140,0,${(1-p)*.8})`;ctx.beginPath();ctx.arc(e.x,e.y,p*60,0,Math.PI*2);ctx.fill();ctx.fillStyle=`rgba(255,220,0,${(1-p)*.5})`;ctx.beginPath();ctx.arc(e.x,e.y,p*35,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  });
}

// ── GAME STATE ───────────────────────────────────────────────
let frame=0,score=0,bg=0;
let p={x:W/2,y:H-195,hp:100,maxhp:100,en:70,maxen:100,shield:false,scool:0,fr:0};
let dragon={x:W/2,y:130,shield:130,maxSh:130,hp:160,maxhp:160,fr:0,dir:1,sp:1.4,at:88};
let breads=[],fireballs=[];
let win=false,gameOver=false;

const SHB={x:16,y:H-106,w:100,h:82};
const FIRE={x:W-120,y:H-106,w:104,h:82};

function update(){
  if(win||gameOver) return;
  frame++;p.fr++;dragon.fr++;
  bg=(bg+1.2)%W;

  // Player drag
  if(T.down&&T.y<H-112){p.x+=(T.x-22-p.x)*.17;p.x=Math.max(14,Math.min(W-14,p.x));}
  p.shield=dn(SHB.x,SHB.y,SHB.w,SHB.h)&&p.en>0;
  if(p.shield)p.en=Math.max(0,p.en-.45);

  // Shoot
  if((frame%17===0&&dn(FIRE.x,FIRE.y,FIRE.w,FIRE.h))&&p.scool<=0){
    breads.push({x:p.x,y:p.y-28,vy:-10});p.scool=17;
  }
  if(p.scool>0)p.scool--;

  // Dragon
  dragon.x+=dragon.dir*dragon.sp;
  if(dragon.x<42){dragon.x=42;dragon.dir=1;}
  if(dragon.x>W-42){dragon.x=W-42;dragon.dir=-1;}
  dragon.at--;
  if(dragon.at<=0){
    const spec=Math.random()<0.28;
    if(spec){
      for(let i=-1;i<=1;i++) fireballs.push({x:dragon.x,y:dragon.y+38,vx:i*2.5+(Math.random()-.5)*1.5,vy:3+Math.random()*2,expl:false,et:0,rand:Math.random()<0.4});
    } else {
      fireballs.push({x:dragon.x+(Math.random()-.5)*50,y:dragon.y+38,vx:(Math.random()-.5)*5,vy:3+Math.random()*3.5,expl:false,et:0,rand:Math.random()<0.28});
    }
    dragon.at=68+Math.floor(Math.random()*52);
  }

  // Breads vs dragon
  breads=breads.filter(b=>{
    b.y+=b.vy;
    if(Math.abs(b.x-dragon.x)<46&&Math.abs(b.y-dragon.y)<60){
      if(dragon.shield>0){dragon.shield-=9;if(dragon.shield<0)dragon.shield=0;}
      else{dragon.hp-=9;addFX(dragon.x,dragon.y,'hit');}
      score+=35;return false;
    }
    return b.y>0;
  });

  // Fireballs
  fireballs=fireballs.filter(f=>{
    if(f.expl){f.et--;if(f.et===0)addFX(f.x,f.y,'expl');return f.et>0;}
    f.x+=f.vx;f.y+=f.vy;f.vy+=.12;
    if(f.x<8||f.x>W-8)f.vx*=-1;
    if(f.rand&&Math.random()<.007){f.expl=true;f.et=24;}
    if(f.y>H-128){if(f.rand){f.expl=true;f.et=24;f.y=H-128;}else{f.vy*=-.65;f.y=H-128;}}
    if(!p.shield){
      const rad=f.expl?50:22;
      if(Math.abs(f.x-p.x)<rad&&Math.abs(f.y-p.y)<rad){p.hp-=f.expl?22:9;addFX(p.x,p.y,'hit');return false;}
    }
    return true;
  });

  updateFX();
  if(dragon.hp<=0){win=true;score+=1200;}
  if(p.hp<=0) gameOver=true;
}

function drawBG(){
  const img=IMGS.bg;
  if(img&&img.complete&&img.naturalWidth>0){
    // Tile bg across
    ctx.drawImage(img,0,0,W,H-110);
    // Dark overlay for night feel
    ctx.fillStyle='rgba(0,0,30,0.45)';ctx.fillRect(0,0,W,H-110);
  } else {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#04051a');g.addColorStop(.55,'#10103a');g.addColorStop(1,'#3a1808');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Stars
    for(let i=0;i<40;i++){
      const bri=Math.sin(frame*.06+i)*.4+.6;
      ctx.fillStyle=`rgba(255,255,255,${bri*.65})`;
      ctx.fillRect((i*87+bg*.2)%W,(i*53)%290,i%4<2?2:1,i%4<2?2:1);
    }
    // Clouds
    for(let i=0;i<4;i++){
      const cx=((i*120+bg*.55)%(W+100))-50;
      ctx.fillStyle='rgba(50,50,100,0.55)';
      ctx.beginPath();ctx.arc(cx,50+i*40,30,0,Math.PI*2);ctx.arc(cx+24,40+i*40,20,0,Math.PI*2);ctx.arc(cx+50,50+i*40,26,0,Math.PI*2);ctx.fill();
    }
  }
  fr(0,H-118,W,118,'#2a1808');fr(0,H-118,W,10,'#3a2818');
}

function draw(){
  drawBG();

  // Dragon breath ambient glow
  if(fireballs.length>0){
    const rg=ctx.createRadialGradient(dragon.x,dragon.y+40,0,dragon.x,dragon.y+40,120);
    rg.addColorStop(0,'rgba(255,80,0,0.12)');rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;ctx.fillRect(dragon.x-120,dragon.y-40,240,200);
  }

  drawDragon(dragon.x,dragon.y,dragon.fr,dragon.shield,dragon.maxSh);

  // Fireballs
  fireballs.forEach(f=>{
    if(!f.expl){
      ctx.shadowColor='#ff6600';ctx.shadowBlur=14;
      ctx.fillStyle='#ff3300';ctx.beginPath();ctx.arc(f.x,f.y,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(f.x,f.y,6,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,80,0,0.25)';ctx.beginPath();ctx.arc(f.x-f.vx*2,f.y-f.vy*2,9,0,Math.PI*2);ctx.fill();
    }
  });

  breads.forEach(b=>drawBread(b.x,b.y,9));
  drawPan(p.x,p.y,p.fr,p.shield);
  if(p.shield&&p.en<20&&frame%6<3){ctx.fillStyle='rgba(80,150,255,0.18)';ctx.fillRect(0,0,W,H);}

  drawFX();

  // HUD
  bar(8,8,145,22,p.hp,p.maxhp,'#e00');txt('HP',12,25,11,'#fff');
  bar(8,34,145,14,p.en,p.maxen,'#22aaff');txt('⚡',12,45,10,'#4af');

  // Dragon bars
  bar(W-158,8,150,16,dragon.shield,dragon.maxSh,'#4af');
  txt('ESCUDO',W-156,21,8,'#4af');
  bar(W-158,28,150,22,dragon.hp,dragon.maxhp,'#f44');
  txt('DRAGÓN',W-156,45,9,'#f88');
  txts(`PUNTOS: ${score}`,W/2,28,12,'#ffd700');

  // Warning when shield is broken
  if(dragon.shield===0&&frame%20<10){txts('⚠️ ¡ESCUDO CAÍDO!',W/2,72,13,'#f44');}

  ctx.globalAlpha=.88;
  btn(SHB.x,SHB.y,SHB.w,SHB.h,'🛡\nESCUDO','#112288');
  btn(FIRE.x,FIRE.y,FIRE.w,FIRE.h,'🍞\nLANZAR','#774400');
  ctx.globalAlpha=1;
  txts('Arrastra para moverte',W/2,H-12,9,'rgba(255,255,255,0.5)');

  if(win){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
    txts('¡DRAGÓN DERROTADO!',W/2,H/2-60,24,'#ffd700');
    txts('¡Combate final con',W/2,H/2-10,15,'#fff');
    txts('Doña Dolores!',W/2,H/2+16,17,'#ff44ff');
    txts(`Puntos: ${score}`,W/2,H/2+50,17,'#ffd700');
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    txts('GAME OVER',W/2,H/2-50,30,'#e33');
    txts('¡El dragón te derrotó!',W/2,H/2,14,'#f88');
    txts(`Puntos: ${score}`,W/2,H/2+35,17,'#ffd700');
  }
}

function loop(){update();ctx.clearRect(0,0,W,H);draw();_jd=false;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
