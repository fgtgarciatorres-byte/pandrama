<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NIVEL 2 — El Laberinto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none;}
#info{color:#0f0;font:bold 11px monospace;padding:4px;background:#111;width:100%;text-align:center;}
canvas{display:block;image-rendering:pixelated;}
</style>
</head>
<body>
<div id="info">NIVEL 2 — El Laberinto | Estilo Príncipe de Persia</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'), ctx=C.getContext('2d');
const BASE_W=390,BASE_H=680;let scale=1;
function resize(){const ih=window.innerHeight-24;scale=Math.min(window.innerWidth/BASE_W,ih/BASE_H);C.style.width=(BASE_W*scale)+'px';C.style.height=(BASE_H*scale)+'px';C.width=BASE_W;C.height=BASE_H;}
resize();window.addEventListener('resize',resize);
const W=BASE_W,H=BASE_H;

const RAW='https://raw.githubusercontent.com/fgtgarciatorres-byte/pandrama/main/';
const IMGS={};
function loadImg(k,p){const i=new Image();i.crossOrigin='anonymous';i.src=RAW+p;IMGS[k]=i;}
loadImg('bg','assets/bg/dungeon.png');
loadImg('pan','assets/sprites/panificador_run.png');

const T={x:0,y:0,down:false};let _jd=false;
function gp(e,i=0){const r=C.getBoundingClientRect(),s=e.changedTouches?e.changedTouches[i]:e;return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=gp(e);T.x=p.x;T.y=p.y;T.down=true;_jd=true;},{passive:false});
C.addEventListener('touchend',  e=>{e.preventDefault();T.down=false;},{passive:false});
C.addEventListener('touchmove', e=>{e.preventDefault();const p=gp(e);T.x=p.x;T.y=p.y;},{passive:false});
C.addEventListener('mousedown', e=>{const p=gp(e);T.x=p.x;T.y=p.y;T.down=true;_jd=true;});
C.addEventListener('mouseup',   ()=>T.down=false);
C.addEventListener('mousemove', e=>{if(T.down){const p=gp(e);T.x=p.x;T.y=p.y;}});
function jd(x,y,w,h){return _jd&&T.x>=x&&T.x<=x+w&&T.y>=y&&T.y<=y+h;}
function dn(x,y,w,h){return T.down&&T.x>=x&&T.x<=x+w&&T.y>=y&&T.y<=y+h;}

function fr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function sr(x,y,w,h,c,lw=1.5){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}
function txt(s,x,y,sz,c,al='left'){ctx.font=`bold ${sz}px monospace`;ctx.fillStyle=c;ctx.textAlign=al;ctx.fillText(s,x,y);}
function txts(s,x,y,sz,c,sh='#000'){ctx.font=`bold ${sz}px monospace`;ctx.textAlign='center';ctx.fillStyle=sh;ctx.fillText(s,x+2,y+2);ctx.fillStyle=c;ctx.fillText(s,x,y);}
function bar(x,y,w,h,v,mx,c){ctx.fillStyle='#1a1a1a';ctx.fillRect(x,y,w,h);ctx.fillStyle=c;ctx.fillRect(x+1,y+1,Math.max(0,Math.floor((w-2)*v/mx)),h-2);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);}
function btn(x,y,w,h,lbl,bg='#223'){ctx.fillStyle='#000';ctx.fillRect(x+2,y+2,w,h);ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);ctx.font='bold 12px monospace';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(lbl,x+w/2,y+h/2+5);}

// Wheat sprite
function drawWheat(x,y){
  ctx.shadowColor='#d4af37';ctx.shadowBlur=12;
  ctx.strokeStyle='#c8a830';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y+14);ctx.lineTo(x,y-14);ctx.stroke();
  ctx.fillStyle='#d4af37';
  for(let i=0;i<5;i++){const s=i%2===0?7:-7;ctx.beginPath();ctx.ellipse(x+s,y-10+i*5,5,3,Math.PI*.35*(i%2===0?1:-1),0,Math.PI*2);ctx.fill();}
  ctx.shadowBlur=0;
}

// Player sprite
function drawPan(x,y,fr_,dir=1){
  const img=IMGS.pan;
  if(img&&img.complete&&img.naturalWidth>0){
    const frames=6,fw=img.width/frames,frame=fr_%frames|0;
    ctx.save();ctx.translate(x,y);if(dir===-1)ctx.scale(-1,1);
    ctx.drawImage(img,frame*fw,0,fw,img.height/2,-22,-24,44,56);
    ctx.restore();
  } else {
    ctx.save();ctx.translate(x,y);if(dir===-1)ctx.scale(-1,1);
    const t=fr_*.25,bob=Math.sin(t)*2;
    ctx.fillStyle='#1a8fff';ctx.beginPath();ctx.moveTo(6,6+bob);ctx.lineTo(-4,26+bob+Math.sin(t)*5);ctx.lineTo(18,18+bob);ctx.closePath();ctx.fill();
    fr(-11,3+bob,28,22,'#1144bb');fr(-4,7+bob,9,5,'#ffd700');
    fr(-8,-11+bob,22,16,'#c8956e');fr(-8,-11+bob,22,6,'#1a0800');
    const ls=Math.sin(t)*5;fr(-9,25+bob,10,14,'#0033aa');fr(4,25+bob-ls,10,14,'#0033aa');
    fr(-16,6+bob,8,14,'#c8956e');fr(16,6+bob,8,14,'#c8956e');
    ctx.restore();
  }
}

// ── LEVEL GENERATION ─────────────────────────────────────────
let screen=0,totalScreens=3,frame=0,score=0;
let gameOver=false,win=false;
let p={x:W/2,y:80,vx:0,vy:0,hp:100,maxhp:100,en:70,maxen:100,onGround:false,fr:0,dir:1,dmgFlash:0};
let plats=[],traps=[],wheat=null;
let exit_={x:W/2-24,y:H-148,w:48,h:38};

function genScreen(sc){
  plats=[{x:W/2-55,y:100,w:110,h:14,moving:false,dir:1,range:0,ox:W/2-55}];
  traps=[];
  const sd=sc*17;
  for(let i=0;i<9;i++){
    const px=18+((sd+i*83)%(W-130));
    const py=155+i*53+((sd+i*29)%30);
    const pw=55+((sd+i*19)%60);
    const mv=((sd+i)%3===0);
    plats.push({x:px,y:py,w:pw,h:14,moving:mv,dir:1,range:mv?52:0,ox:px});
    // Traps on some platforms
    if((sd+i*13)%4===0&&pw>40) traps.push({x:px+pw/2-14,y:py-20,w:28,h:18});
  }
  // Floor
  plats.push({x:0,y:H-140,w:W,h:20,moving:false,dir:1,range:0,ox:0});
  // Wheat hidden in corner
  wheat=(Math.random()<0.5||sc===1)?{x:12+(sc%2)*(W-36),y:180+sc*60,collected:false}:null;
  exit_={x:W/2-24,y:H-140,w:48,h:38};
  p.x=W/2;p.y=80;p.vx=0;p.vy=0;
}
genScreen(0);

const LFT={x:8,y:H-138,w:82,h:60};
const RGT={x:94,y:H-138,w:82,h:60};
const JMP={x:W-115,y:H-138,w:107,h:60};

function update(){
  if(gameOver||win) return;
  frame++;p.fr++;
  if(p.dmgFlash>0) p.dmgFlash--;

  if(dn(LFT.x,LFT.y,LFT.w,LFT.h)){p.vx=-3.2;p.dir=-1;}
  else if(dn(RGT.x,RGT.y,RGT.w,RGT.h)){p.vx=3.2;p.dir=1;}
  else p.vx*=0.6;

  if(jd(JMP.x,JMP.y,JMP.w,JMP.h)&&p.onGround){p.vy=-12.5;p.onGround=false;}

  p.vy=Math.min(p.vy+0.55,18); p.x+=p.vx; p.y+=p.vy;
  p.x=Math.max(12,Math.min(W-12,p.x));

  // Platform movement
  plats.forEach(pl=>{
    if(pl.moving){pl.x+=pl.dir*1.6;if(pl.x<pl.ox-pl.range||pl.x>pl.ox+pl.range)pl.dir*=-1;}
  });

  // Collision
  p.onGround=false;
  plats.forEach(pl=>{
    if(p.x+13>pl.x&&p.x-13<pl.x+pl.w&&p.y+28>pl.y&&p.y+28<pl.y+pl.h+20&&p.vy>=0){
      p.y=pl.y-28;p.vy=0;p.onGround=true;
      if(pl.moving)p.x+=pl.dir*1.6;
    }
  });

  // Trap damage
  traps.forEach(tr=>{
    if(Math.abs(p.x-(tr.x+14))<16&&Math.abs(p.y-(tr.y+9))<22){
      p.hp=Math.max(0,p.hp-.38);p.dmgFlash=8;
    }
  });

  // Wheat pickup
  if(wheat&&!wheat.collected&&Math.abs(p.x-wheat.x)<28&&Math.abs(p.y-wheat.y)<28){
    wheat.collected=true;p.en=Math.min(100,p.en+55);score+=60;
  }

  // Exit
  if(p.x>exit_.x&&p.x<exit_.x+exit_.w&&p.y+24>exit_.y&&p.y<exit_.y+exit_.h){
    screen++;
    if(screen>=totalScreens){win=true;score+=600;}
    else genScreen(screen);
  }

  if(p.hp<=0||p.y>H+80) gameOver=true;
}

function drawBG(){
  const bg=IMGS.bg;
  if(bg&&bg.complete&&bg.naturalWidth>0){
    ctx.drawImage(bg,0,0,W,H);
  } else {
    // Dungeon fallback
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0520');g.addColorStop(1,'#080e08');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Stone texture
    ctx.strokeStyle='rgba(60,40,90,0.25)';ctx.lineWidth=1;
    for(let r=0;r<14;r++) for(let cc=0;cc<7;cc++) ctx.strokeRect(cc*58+(r%2)*29,r*52,56,24);
    // Wall highlights
    fr(0,0,6,H,'rgba(30,15,50,0.6)');fr(W-6,0,6,H,'rgba(30,15,50,0.6)');
  }
}

function draw(){
  drawBG();

  // Torches
  for(let i=0;i<3;i++){
    const tx=75+i*120,flicker=Math.sin(frame*.18+i)*0.35+0.65;
    fr(tx,H-380,7,22,'#6a3a10');
    ctx.fillStyle=`rgba(255,160,0,${flicker*.7})`;ctx.shadowColor='#f80';ctx.shadowBlur=22;
    ctx.beginPath();ctx.arc(tx+3,H-384,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,220,50,${flicker*.9})`;ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(tx+3,H-384,5,0,Math.PI*2);ctx.fill();
    // Light pool
    const rg=ctx.createRadialGradient(tx+3,H-384,0,tx+3,H-384,60);
    rg.addColorStop(0,`rgba(255,160,0,${flicker*.18})`);rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;ctx.fillRect(tx-57,H-444,120,120);
  }

  // Platforms
  plats.forEach(pl=>{
    // Stone platform
    const pg=ctx.createLinearGradient(pl.x,pl.y,pl.x,pl.y+pl.h);
    pg.addColorStop(0,'#7a6040');pg.addColorStop(1,'#4a3820');
    ctx.fillStyle=pg;ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    // Top highlight
    fr(pl.x,pl.y,pl.w,3,'#9a8060');
    // Stone blocks
    ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;
    for(let b=0;b<Math.floor(pl.w/20);b++) ctx.strokeRect(pl.x+b*20,pl.y,20,pl.h);
    // Moving indicator
    if(pl.moving){
      ctx.strokeStyle='rgba(255,200,0,0.6)';ctx.lineWidth=1.5;
      ctx.strokeRect(pl.x,pl.y,pl.w,pl.h);
      // Arrow indicator
      ctx.fillStyle='rgba(255,200,0,0.7)';ctx.font='8px monospace';ctx.textAlign='center';
      ctx.fillText('↔',pl.x+pl.w/2,pl.y+pl.h-3);
    }
  });

  // Traps (teeth / spikes)
  traps.forEach(tr=>{
    // Danger glow
    if(frame%30<15){ctx.shadowColor='#f00';ctx.shadowBlur=8;}
    ctx.fillStyle='#cc1100';
    for(let i=0;i<4;i++){
      ctx.beginPath();ctx.moveTo(tr.x+i*7,tr.y+tr.h);
      ctx.lineTo(tr.x+3.5+i*7,tr.y);ctx.lineTo(tr.x+7+i*7,tr.y+tr.h);ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(200,0,0,0.15)';ctx.fillRect(tr.x-5,tr.y-5,tr.w+10,tr.h+10);
    ctx.strokeStyle='rgba(255,50,50,0.5)';ctx.lineWidth=1;ctx.strokeRect(tr.x-2,tr.y-2,tr.w+4,tr.h+4);
  });

  // Wheat
  if(wheat&&!wheat.collected) drawWheat(wheat.x,wheat.y);

  // Exit door
  const eg=ctx.createLinearGradient(exit_.x,exit_.y,exit_.x,exit_.y+exit_.h);
  eg.addColorStop(0,'#006000');eg.addColorStop(1,'#003000');
  ctx.fillStyle=eg;ctx.fillRect(exit_.x,exit_.y,exit_.w,exit_.h);
  ctx.strokeStyle=frame%20<10?'#00ff00':'#00aa00';ctx.lineWidth=2;ctx.strokeRect(exit_.x,exit_.y,exit_.w,exit_.h);
  txts('EXIT',exit_.x+exit_.w/2,exit_.y+24,11,'#0f0');

  // Player
  if(p.dmgFlash>0){ctx.globalAlpha=0.5;}
  drawPan(p.x,p.y,p.fr,p.dir);
  ctx.globalAlpha=1;
  // Shadow under player
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(p.x,p.y+28,12,4,0,0,Math.PI*2);ctx.fill();

  // HUD
  bar(8,8,145,22,p.hp,p.maxhp,'#e00');txt('HP',12,25,11,'#fff');
  bar(8,34,145,14,p.en,p.maxen,'#22aaff');txt('⚡',12,45,10,'#4af');
  txts(`PANTALLA ${screen+1}/${totalScreens}`,W/2,28,14,'#ffd700');
  txts(`PUNTOS: ${score}`,W/2,48,10,'#aaa');

  // Wheat hint
  if(wheat&&!wheat.collected){
    txts('🌾 ¡Trigo oculto!',W/2,72,10,'rgba(212,175,55,0.7)');
  }

  // Controls
  ctx.globalAlpha=.88;
  btn(LFT.x,LFT.y,LFT.w,LFT.h,'◀','#223');
  btn(RGT.x,RGT.y,RGT.w,RGT.h,'▶','#223');
  btn(JMP.x,JMP.y,JMP.w,JMP.h,'▲ SALTO','#004400');
  ctx.globalAlpha=1;

  // Screen transition between rooms
  if(screen>0&&frame<30){
    const a=1-frame/30;ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);
    txts(`PANTALLA ${screen+1}`,W/2,H/2,22,'#ffd700');
  }

  if(win){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
    txts('¡LABERINTO SUPERADO!',W/2,H/2-60,22,'#ffd700');
    txts('3 pantallas completadas',W/2,H/2-20,14,'#fff');
    txts(`Puntos: ${score}`,W/2,H/2+20,17,'#ffd700');
    txts('¡Listo para el combate!',W/2,H/2+55,12,'#0f0');
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    txts('GAME OVER',W/2,H/2-50,30,'#e33');
    txts(p.hp<=0?'¡Las trampas te atraparon!':'¡Caíste al vacío!',W/2,H/2,14,'#f88');
    txts(`Puntos: ${score}`,W/2,H/2+35,17,'#ffd700');
  }
}

function loop(){update();ctx.clearRect(0,0,W,H);draw();_jd=false;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
