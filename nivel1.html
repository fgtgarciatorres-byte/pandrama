<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NIVEL 1 — El Panificador</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; touch-action:none; }
#info { color:#ffd700; font:bold 11px monospace; padding:4px 8px; background:#111; width:100%; text-align:center; }
canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<div id="info">NIVEL 1 — Arrastra para moverte | ESCUDO y LANZAR con botones</div>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const BASE_W = 390, BASE_H = 680;
let scale = 1;
function resize() {
  const ih = window.innerHeight - 24;
  scale = Math.min(window.innerWidth / BASE_W, ih / BASE_H);
  C.style.width  = (BASE_W * scale) + 'px';
  C.style.height = (BASE_H * scale) + 'px';
  C.width = BASE_W; C.height = BASE_H;
}
resize(); window.addEventListener('resize', resize);
const W = BASE_W, H = BASE_H;

// ── ASSETS ──────────────────────────────────────────────────
const RAW = 'https://raw.githubusercontent.com/fgtgarciatorres-byte/pandrama/main/';
const IMGS = {};
function loadImg(key, path) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = RAW + path;
  img.onerror = () => console.warn('No cargó:', path);
  IMGS[key] = img;
}
loadImg('bg',    'assets/bg/vinedo.png');
loadImg('pan',   'assets/sprites/panificador_run.png');
loadImg('exc',   'assets/sprites/excursionista.png');

// ── INPUT ────────────────────────────────────────────────────
const T = { x:0, y:0, down:false };
let _jd = false;
function gp(e, i=0) {
  const r = C.getBoundingClientRect();
  const s = e.changedTouches ? e.changedTouches[i] : e;
  return { x:(s.clientX-r.left)/scale, y:(s.clientY-r.top)/scale };
}
C.addEventListener('touchstart',  e => { e.preventDefault(); const p=gp(e); T.x=p.x; T.y=p.y; T.down=true;  _jd=true; }, {passive:false});
C.addEventListener('touchend',    e => { e.preventDefault(); T.down=false; }, {passive:false});
C.addEventListener('touchmove',   e => { e.preventDefault(); const p=gp(e); T.x=p.x; T.y=p.y; }, {passive:false});
C.addEventListener('mousedown',   e => { const p=gp(e); T.x=p.x; T.y=p.y; T.down=true; _jd=true; });
C.addEventListener('mouseup',     () => { T.down=false; });
C.addEventListener('mousemove',   e => { if(T.down){ const p=gp(e); T.x=p.x; T.y=p.y; }});
function jd(x,y,w,h) { return _jd && T.x>=x && T.x<=x+w && T.y>=y && T.y<=y+h; }
function dn(x,y,w,h) { return T.down && T.x>=x && T.x<=x+w && T.y>=y && T.y<=y+h; }

// ── DRAW HELPERS ─────────────────────────────────────────────
function fr(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function sr(x,y,w,h,c,lw=1.5) { ctx.strokeStyle=c; ctx.lineWidth=lw; ctx.strokeRect(x,y,w,h); }
function txt(s,x,y,sz,c,al='left') { ctx.font=`bold ${sz}px monospace`; ctx.fillStyle=c; ctx.textAlign=al; ctx.fillText(s,x,y); }
function txts(s,x,y,sz,c,sh='#000') {
  ctx.font=`bold ${sz}px monospace`; ctx.textAlign='center';
  ctx.fillStyle=sh; ctx.fillText(s,x+2,y+2);
  ctx.fillStyle=c;  ctx.fillText(s,x,y);
}
function bar(x,y,w,h,v,mx,c,bg='#1a1a1a') {
  fr(x,y,w,h,bg);
  const fw = Math.max(0, Math.floor((w-2)*v/mx));
  fr(x+1,y+1,fw,h-2,c);
  sr(x,y,w,h,'#fff',1);
}
function btn(x,y,w,h,lbl,bg='#880000') {
  fr(x+2,y+2,w,h,'#000');
  fr(x,y,w,h,bg);
  sr(x,y,w,h,'rgba(255,255,255,0.5)',1.5);
  ctx.font=`bold 12px monospace`; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText(lbl, x+w/2, y+h/2+5);
}

// ── SPRITE PIXEL ART (fallback si no carga imagen) ───────────
function drawPanCanvas(x,y,fr_,dir=1,shield=false,atk=false) {
  ctx.save(); ctx.translate(x,y);
  if(dir===-1) ctx.scale(-1,1);
  const t=fr_*0.25, bob=Math.sin(t)*2;
  if(shield){ ctx.shadowColor='#4af'; ctx.shadowBlur=14; }
  ctx.fillStyle='#1a8fff';
  ctx.beginPath(); ctx.moveTo(6,6+bob); ctx.lineTo(-4,28+bob+Math.sin(t)*5);
  ctx.lineTo(18,20+bob); ctx.closePath(); ctx.fill();
  fr(-11,3+bob,28,22,'#1144bb'); fr(-9,5+bob,24,14,'#2266dd');
  fr(-4,7+bob,9,5,'#ffd700'); fr(-4,7+bob,6,10,'#ffd700'); fr(2,7+bob,3,5,'#ffd700');
  fr(-8,-11+bob,22,16,'#c8956e'); fr(-8,-11+bob,22,6,'#1a0800');
  fr(-4,-5+bob,4,3,'#fff'); fr(7,-5+bob,4,3,'#fff');
  fr(-3,-4+bob,2,2,'#000'); fr(8,-4+bob,2,2,'#000');
  const ls=Math.sin(t)*5;
  fr(-9,25+bob,10,16,'#0033aa'); fr(4,25+bob-ls,10,16,'#0033aa');
  fr(-10,39+bob,12,6,'#220a00'); fr(3,39+bob-ls,12,6,'#220a00');
  if(atk){ fr(-16,6+bob,8,10,'#c8956e'); fr(16,4+bob,8,18,'#c8956e'); }
  else    { fr(-16,6+bob,8,16,'#c8956e'); fr(16,6+bob,8,16,'#c8956e'); }
  if(shield){ ctx.strokeStyle='rgba(80,180,255,0.5)'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(3,15+bob,24,32,0,0,Math.PI*2); ctx.stroke(); }
  ctx.restore();
}

function drawExcCanvas(x,y,fr_,dir=1) {
  ctx.save(); ctx.translate(x,y);
  if(dir===-1) ctx.scale(-1,1);
  const t=fr_*0.25, bob=Math.sin(t)*2;
  fr(10,-6+bob,20,30,'#4d6a34'); fr(12,-4+bob,16,26,'#6a8a50');
  fr(-11,-1+bob,27,24,'#5a7a48'); fr(-9,1+bob,23,18,'#7a9a68');
  fr(-9,-15+bob,22,16,'#c8956e'); fr(-9,-15+bob,22,6,'#3a2510');
  fr(-4,-5+bob,4,3,'#fff'); fr(6,-5+bob,4,3,'#fff');
  fr(-3,-4+bob,2,2,'#000'); fr(7,-4+bob,2,2,'#000');
  fr(-9,23+bob,10,16,'#486030'); fr(3,23+bob,10,16,'#486030');
  fr(-10,37+bob,12,5,'#2a1a00'); fr(2,37+bob,12,5,'#2a1a00');
  fr(-18,3+bob,8,16,'#c8956e'); fr(16,3+bob,8,16,'#c8956e');
  ctx.restore();
}

// Usa imagen si está cargada, si no dibuja con canvas
function drawPan(x,y,fr_,dir=1,shield=false,atk=false) {
  const img = IMGS.pan;
  if(img && img.complete && img.naturalWidth>0) {
    const frames=6, fw=img.width/frames;
    const frame = fr_%frames|0;
    ctx.save(); ctx.translate(x,y); if(dir===-1) ctx.scale(-1,1);
    if(shield){ ctx.shadowColor='#4af'; ctx.shadowBlur=12; }
    ctx.drawImage(img, frame*fw,0, fw,img.height/2, -22,-22, 44,55);
    ctx.restore();
  } else {
    drawPanCanvas(x,y,fr_,dir,shield,atk);
  }
}

function drawExc(x,y,fr_,dir=1) {
  const img = IMGS.exc;
  if(img && img.complete && img.naturalWidth>0) {
    const frames=6, fw=img.width/frames;
    const frame=fr_%frames|0;
    ctx.save(); ctx.translate(x,y); if(dir===-1) ctx.scale(-1,1);
    ctx.drawImage(img, frame*fw,0, fw,img.height/2, -24,-24,48,55);
    ctx.restore();
  } else {
    drawExcCanvas(x,y,fr_,dir);
  }
}

function drawBread(x,y,sz=10) {
  ctx.fillStyle='#b87010'; ctx.beginPath(); ctx.ellipse(x,y,sz,sz*0.48,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d8900a'; ctx.beginPath(); ctx.ellipse(x,y-1,sz*0.65,sz*0.28,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#8a5008'; ctx.lineWidth=1;
  for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(x-sz*.5,y+i*2.5); ctx.lineTo(x+sz*.5,y+i*2.5); ctx.stroke(); }
}

function drawWheat(x,y) {
  ctx.shadowColor='#d4af37'; ctx.shadowBlur=10;
  ctx.strokeStyle='#c8a830'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y+14); ctx.lineTo(x,y-14); ctx.stroke();
  ctx.fillStyle='#d4af37';
  for(let i=0;i<5;i++){
    const side=i%2===0?7:-7;
    ctx.beginPath(); ctx.ellipse(x+side,y-10+i*5,5,3,Math.PI*.35*(i%2===0?1:-1),0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
}

function drawBag(x,y) {
  fr(x-11,y-9,22,18,'#8B4513'); fr(x-9,y-12,18,5,'#6B3010');
  sr(x-11,y-9,22,18,'#ffd700',1);
  ctx.font='bold 9px monospace'; ctx.fillStyle='#ffd700'; ctx.textAlign='center'; ctx.fillText('G',x,y+5);
}

// ── FX ───────────────────────────────────────────────────────
let FX = [];
function addFX(x,y,type,col='#ff0') { FX.push({x,y,type,col,t:0,max:38}); }
function updateFX() { FX = FX.filter(e=>(e.t++)<e.max); }
function drawFX() {
  FX.forEach(e=>{
    const p=e.t/e.max; ctx.globalAlpha=(1-p)*0.9;
    if(e.type==='hit'){
      ctx.strokeStyle=e.col; ctx.lineWidth=3;
      for(let i=0;i<8;i++){
        const a=(i/8)*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(e.x+Math.cos(a)*8,e.y+Math.sin(a)*8);
        ctx.lineTo(e.x+Math.cos(a)*p*50,e.y+Math.sin(a)*p*50); ctx.stroke();
      }
    } else {
      ['#f00','#f80','#ff0','#0f0','#0af','#a0f'].forEach((c,i)=>{
        ctx.strokeStyle=c; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(e.x,e.y,10+i*8+p*35,0,Math.PI*2); ctx.stroke();
      });
    }
    ctx.globalAlpha=1;
  });
}

// ── GAME STATE ───────────────────────────────────────────────
let frame=0, score=0;
let p = { x:65, y:H-205, hp:100, maxhp:100, en:0, maxen:100, shield:false, scool:0, fr:0, dir:1 };
let e = { x:W-65, y:55, hp:100, maxhp:100, fr:0, dir:-1, sp:1.8, tcool:80 };
let breads=[], items=[], coll=[], bags=0;
const BAGS_NEEDED = 5;
let bgX=0;
let gameOver=false, win=false;

function spawnColl() {
  for(let i=0;i<3;i++)
    coll.push({ type:'wheat', x:60+Math.random()*(W-120), y:H-235+Math.random()*50, collected:false });
}
spawnColl();

function throwItem() {
  items.push({ x:e.x, y:e.y+20, vx:(Math.random()-.5)*7, vy:2+Math.random()*4,
    type:Math.floor(Math.random()*3), angle:0, spin:(Math.random()-.5)*0.25 });
}

// ── UPDATE ───────────────────────────────────────────────────
const SHB  = {x:16,  y:H-108, w:100, h:82};
const FIRE = {x:W-120, y:H-108, w:104, h:82};

function update() {
  if(gameOver||win) return;
  frame++; p.fr++; e.fr++;
  bgX = (bgX - 0.9 + W) % W;

  // Move player by drag
  if(T.down && T.y < H-115) {
    p.x += (T.x - 22 - p.x) * 0.18;
    p.x = Math.max(14, Math.min(W-14, p.x));
  }

  // Shield
  p.shield = dn(SHB.x,SHB.y,SHB.w,SHB.h) && p.en > 0;
  if(p.shield) p.en = Math.max(0, p.en - 0.5);

  // Shoot bread (tap OR hold)
  if((jd(FIRE.x,FIRE.y,FIRE.w,FIRE.h) || (dn(FIRE.x,FIRE.y,FIRE.w,FIRE.h) && frame%18===0)) && p.scool<=0) {
    breads.push({x:p.x, y:p.y-25, vy:-9});
    p.scool=18;
  }
  if(p.scool>0) p.scool--;

  // Enemy movement
  e.x += e.dir * e.sp;
  if(e.x<38){e.x=38;e.dir=1;} if(e.x>W-38){e.x=W-38;e.dir=-1;}
  e.tcool--;
  if(e.tcool<=0){ throwItem(); e.tcool=50+Math.floor(Math.random()*55); }

  // Random bag drop
  if(frame%220===0 && bags<BAGS_NEEDED)
    coll.push({type:'bag',x:30+Math.random()*(W-60),y:70,vy:2+Math.random()*2,vx:(Math.random()-.5)*3,collected:false});

  // Random wheat
  if(frame%300===0)
    coll.push({type:'wheat',x:50+Math.random()*(W-100),y:H-240,collected:false});

  // Breads vs enemy
  breads = breads.filter(b=>{
    b.y += b.vy;
    if(Math.abs(b.x-e.x)<32 && Math.abs(b.y-e.y)<40) {
      e.hp-=10; score+=50; addFX(e.x,e.y,'hit','#f80'); return false;
    }
    return b.y>0;
  });

  // Enemy items
  items = items.filter(it=>{
    it.x+=it.vx; it.y+=it.vy; it.angle+=it.spin; it.vy+=0.22;
    if(it.x<10||it.x>W-10) it.vx*=-1;
    if(it.y>H-140){ it.y=H-140; it.vy*=-0.65; if(Math.abs(it.vy)<1)it.vy=0; }
    if(!p.shield && Math.abs(it.x-p.x)<26 && Math.abs(it.y-p.y)<38) {
      p.hp-=6; addFX(p.x,p.y,'hit','#f00'); return false;
    }
    return true;
  });

  // Collectibles
  coll.forEach(c=>{
    if(c.collected) return;
    if(c.type==='bag'){ c.y+=c.vy; c.x+=c.vx; c.vy+=0.12; if(c.x<10||c.x>W-10)c.vx*=-1; if(c.y>H-140){c.y=H-140;c.vy=0;c.vx=0;} }
    if(Math.abs(c.x-p.x)<30 && Math.abs(c.y-p.y)<38) {
      c.collected=true;
      if(c.type==='bag'){ bags++; score+=150; addFX(c.x,c.y,'hit','#ffd700'); }
      else { p.en=Math.min(100,p.en+32); score+=25; addFX(c.x,c.y,'hit','#ffd700'); }
    }
  });
  coll = coll.filter(c=>!c.collected);

  updateFX();

  if(bags>=BAGS_NEEDED || e.hp<=0) win=true;
  if(p.hp<=0) gameOver=true;
}

// ── DRAW ─────────────────────────────────────────────────────
function drawBG() {
  const bg = IMGS.bg;
  if(bg && bg.complete && bg.naturalWidth>0) {
    ctx.drawImage(bg, bgX, 0, W, H-100);
    ctx.drawImage(bg, bgX-W, 0, W, H-100);
    ctx.drawImage(bg, bgX+W, 0, W, H-100);
    // Ground overlay
    fr(0, H-115, W, 115, '#3a2010');
    const gg = ctx.createLinearGradient(0,H-115,0,H-105);
    gg.addColorStop(0,'#5a9040'); gg.addColorStop(1,'transparent');
    ctx.fillStyle=gg; ctx.fillRect(0,H-115,W,14);
  } else {
    // Fallback gradient bg
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#88c8f0'); g.addColorStop(0.45,'#f5a020'); g.addColorStop(1,'#3a2010');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(let i=0;i<7;i++){
      const vx=((i*70+bgX)%(W+70))-35;
      fr(vx+3,H-220,7,110,'#4a2810');
      ctx.fillStyle='#2a6020'; ctx.beginPath(); ctx.arc(vx+6,H-220,14,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#5a0070';
      for(let g2=0;g2<3;g2++){ ctx.beginPath(); ctx.arc(vx+6,H-215+g2*14,5,0,Math.PI*2); ctx.fill(); }
    }
    fr(0,H-115,W,115,'#4a3018'); fr(0,H-115,W,12,'#3a7030');
  }
}

function drawMoto() {
  ctx.save(); ctx.translate(e.x, e.y);
  if(e.dir===1) ctx.scale(-1,1);
  fr(-28,5,56,16,'#333'); fr(-20,3,40,6,'#555');
  ctx.fillStyle='#888'; for(const ax of[-18,18]){ ctx.beginPath(); ctx.arc(ax,22,10,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#444'; for(const ax of[-18,18]){ ctx.beginPath(); ctx.arc(ax,22,6,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}

function draw() {
  drawBG();

  // Items
  items.forEach(it=>{
    ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.angle);
    if(it.type===0){ fr(-8,-5,16,10,'#667755'); sr(-8,-5,16,10,'#aaa',1); }
    else if(it.type===1){ ctx.strokeStyle='#aaa'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(0,0,9,6,0,0,Math.PI*2); ctx.stroke(); }
    else { ctx.fillStyle='#ccc'; ctx.beginPath(); ctx.arc(0,0,9,Math.PI,0); ctx.fill(); }
    ctx.restore();
  });

  // Collectibles
  coll.forEach(c=>{ if(!c.collected){ if(c.type==='wheat') drawWheat(c.x,c.y); else drawBag(c.x,c.y); }});

  // Breads
  breads.forEach(b=>drawBread(b.x,b.y,8));

  // Moto + enemy
  drawMoto();
  drawExc(e.x, e.y-18, e.fr, e.dir);

  // Player
  drawPan(p.x, p.y, p.fr, p.dir, p.shield);

  // Shield blink
  if(p.shield && p.en<20 && frame%6<3){ ctx.fillStyle='rgba(80,150,255,0.18)'; ctx.fillRect(0,0,W,H); }

  drawFX();

  // ── HUD ──────────────────────────────────────────────────
  // Player bars
  bar(8,8,145,22,p.hp,p.maxhp,'#00dd00');
  txt('❤',12,25,13,'#fff');
  bar(8,34,145,14,p.en,p.maxen,'#22aaff');
  txt('⚡',12,45,10,'#4af');

  // Enemy bar
  bar(W-153,8,145,22,e.hp,e.maxhp,'#ff6600');
  txt('EXCURSIONISTA',W-150,25,8,'#ffaa44');

  // Bags counter
  const bIcons = Array.from({length:BAGS_NEEDED},(_,i)=> i<bags ? '👜' : '▢').join(' ');
  txts(bIcons, W/2, 52, 13, '#ffd700');
  txts(`PUNTOS: ${score}`, W/2, 28, 11, '#fff');
  txts(`Bolsos ${bags}/${BAGS_NEEDED}`, W/2, 70, 10, '#ffaa44');

  // ── CONTROLS ─────────────────────────────────────────────
  const opa = 0.85;
  ctx.globalAlpha = opa;
  btn(SHB.x,  SHB.y,  SHB.w,  SHB.h,  '🛡 ESCUDO', '#112288');
  btn(FIRE.x, FIRE.y, FIRE.w, FIRE.h, '🍞 LANZAR', '#774400');
  ctx.globalAlpha = 1;

  // Drag hint
  ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(SHB.x+SHB.w+4, H-108, W-SHB.w-FIRE.w-24, 82);
  txts('ARRASTRA\nPARA\nMOVERTE', W/2, H-72, 9, 'rgba(255,255,255,0.5)');

  // ── END SCREENS ───────────────────────────────────────────
  if(win) {
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
    txts('¡NIVEL SUPERADO!', W/2, H/2-50, 26, '#ffd700');
    txts(`Bolsos recogidos: ${bags}`, W/2, H/2, 15, '#fff');
    txts(`Puntos: ${score}`, W/2, H/2+30, 17, '#ffd700');
    txts('¡Listo para el combate!', W/2, H/2+60, 13, '#aaa');
  }
  if(gameOver) {
    ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,W,H);
    txts('GAME OVER', W/2, H/2-50, 30, '#e33');
    txts(`Puntos: ${score}`, W/2, H/2, 17, '#ffd700');
  }
}

// ── LOOP ─────────────────────────────────────────────────────
function loop() {
  update();
  ctx.clearRect(0,0,W,H);
  draw();
  _jd = false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
