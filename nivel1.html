<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>NIVEL 1</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><style>:root{--ic:#ffd700}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none;}
#info{color:var(--ic);font:bold 9px 'Press Start 2P',monospace;padding:6px 8px;background:rgba(0,0,0,0.8);width:100%;text-align:center;letter-spacing:1px;}
canvas{display:block;image-rendering:pixelated;}
</style></head>
<body><div id="info">NIVEL 1 — EL VIÑEDO</div><canvas id="c"></canvas><script>

const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=390,H=680;let scale=1;
function resize(){scale=Math.min(window.innerWidth/W,(window.innerHeight-24)/H);C.style.width=(W*scale)+'px';C.style.height=(H*scale)+'px';C.width=W;C.height=H;}
resize();window.addEventListener('resize',resize);
const T={x:0,y:0,down:false};let _jd=false;
function gp(e){const r=C.getBoundingClientRect(),s=e.changedTouches?e.changedTouches[0]:e;return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};}
['touchstart','touchend','touchmove'].forEach(ev=>C.addEventListener(ev,e=>{e.preventDefault();const p=gp(e);if(ev!=='touchend'){T.x=p.x;T.y=p.y;}T.down=ev==='touchstart'||ev==='touchmove';if(ev==='touchstart')_jd=true;},{passive:false}));
C.addEventListener('mousedown',e=>{const p=gp(e);T.x=p.x;T.y=p.y;T.down=true;_jd=true;});
C.addEventListener('mouseup',()=>T.down=false);
C.addEventListener('mousemove',e=>{if(T.down){const p=gp(e);T.x=p.x;T.y=p.y;}});
function jd(x,y,w,h){return _jd&&T.x>=x&&T.x<=x+w&&T.y>=y&&T.y<=y+h;}
function dn(x,y,w,h){return T.down&&T.x>=x&&T.x<=x+w&&T.y>=y&&T.y<=y+h;}
const IMGS={};
function loadImg(k,...names){
  names.reduce((p,n)=>p.catch(()=>new Promise((ok,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{IMGS[k]=i;console.log('✅',k,n);ok(i)};i.onerror=()=>rej();i.src='https://raw.githubusercontent.com/fgtgarciatorres-byte/pandrama/main/'+n;})),Promise.reject()).catch(()=>console.warn('❌',k));
}
function ok(k){const i=IMGS[k];return i&&i.complete&&i.naturalWidth>0;}
let fontOK=false;document.fonts.ready.then(()=>fontOK=document.fonts.check('12px "Press Start 2P"'));
function gf(sz){return `bold ${sz}px ${fontOK?"'Press Start 2P',monospace":'monospace'}`;}
function fr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function sr(x,y,w,h,c,lw){ctx.strokeStyle=c;ctx.lineWidth=lw||1.5;ctx.strokeRect(x,y,w,h);}
function txt(s,x,y,sz,c,al){ctx.font=gf(sz);ctx.fillStyle=c;ctx.textAlign=al||'left';ctx.fillText(s,x,y);}
function txts(s,x,y,sz,c){ctx.font=gf(sz);ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillText(s,x+2,y+2);ctx.fillStyle=c;ctx.fillText(s,x,y);}
function bar(x,y,w,h,v,mx,c){fr(x,y,w,h,'#111');const f=Math.max(0,(w-2)*v/mx|0);const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c);g.addColorStop(1,c+'55');ctx.fillStyle=g;ctx.fillRect(x+1,y+1,f,h-2);ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x+1,y+1,f,Math.ceil((h-2)/3));ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);}
function btn(x,y,w,h,lbl,bg,tc){fr(x+3,y+3,w,h,'rgba(0,0,0,0.5)');const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,(bg||'#444')+'ee');g.addColorStop(1,(bg||'#444')+'77');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x+1,y+1,w-2,Math.ceil(h/3));ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);ctx.font=gf(9);ctx.fillStyle=tc||'#fff';ctx.textAlign='center';ctx.fillText(lbl,x+w/2,y+h/2+4);}
function drawBread(x,y,sz){sz=sz||10;ctx.fillStyle='#b87010';ctx.beginPath();ctx.ellipse(x,y,sz,sz*.48,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8a030';ctx.beginPath();ctx.ellipse(x,y-1,sz*.65,sz*.28,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7a4008';ctx.lineWidth=1;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x-sz*.5,y+i*2.5);ctx.lineTo(x+sz*.5,y+i*2.5);ctx.stroke();}}
function drawWheat(x,y){ctx.shadowColor='#d4af37';ctx.shadowBlur=10;ctx.strokeStyle='#c8a830';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+14);ctx.lineTo(x,y-14);ctx.stroke();ctx.fillStyle='#d4af37';for(let i=0;i<5;i++){const s=i%2===0?7:-7;ctx.beginPath();ctx.ellipse(x+s,y-10+i*5,5,3,Math.PI*.35*(i%2===0?1:-1),0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;}
function drawBag(x,y){fr(x-12,y-10,24,20,'#8B4513');fr(x-10,y-13,20,6,'#6B3010');sr(x-12,y-10,24,20,'#ffd700',1.5);ctx.font=gf(9);ctx.fillStyle='#ffd700';ctx.textAlign='center';ctx.fillText('G',x,y+5);}

// pan1.png = imagen ESTÁTICA del jugador para niveles
// La animación se hace matemáticamente: bob, inclinación al correr, rebote al atacar
function drawPan(x,y,fr_,dir,shield,state){
  dir=dir===undefined?1:dir; shield=!!shield; state=state||'run';
  const t=fr_*.18;
  const bob  = Math.sin(t)*3;                        // rebote vertical al correr
  const lean = (state==='run')?Math.sin(t)*.06:0;    // inclinación al correr
  ctx.save();
  ctx.translate(x, y+bob);
  if(dir===-1) ctx.scale(-1,1);
  ctx.rotate(lean);
  if(shield){ ctx.shadowColor='#4af'; ctx.shadowBlur=16; }

  if(ok('pan')){
    const img=IMGS.pan;
    // Mantener proporción original, encajar en 56×72px
    const ih=72, iw=Math.round(img.width/img.height*ih);
    ctx.drawImage(img, -iw/2, -ih, iw, ih);
  } else {
    // Fallback geométrico si no carga
    const S=2.2, b=bob;
    ctx.fillStyle='#1a8fff';
    ctx.beginPath();ctx.moveTo(6*S,6*S+b);ctx.lineTo(-4*S,28*S+b);ctx.lineTo(18*S,20*S+b);ctx.closePath();ctx.fill();
    fr(-11*S,3*S+b,28*S,22*S,'#1144bb');
    ctx.fillStyle='#ffd700';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillText('P',1,16*S+b);
    fr(-8*S,-11*S+b,22*S,18*S,'#c8956e'); fr(-8*S,-11*S+b,22*S,7*S,'#1a0800');
    const ls=state==='atk'?8:Math.sin(t)*5;
    fr(-9*S,25*S+b,11*S,18*S,'#0033aa'); fr(4*S,25*S+b-ls,11*S,18*S,'#0033aa');
  }

  // Escudo azul activo
  if(shield){
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(80,180,255,0.65)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(0,-10,30,42,0,0,Math.PI*2); ctx.stroke();
    // Parpadeo cuando energía baja
    if(p.en<20 && frame%6<3){
      ctx.strokeStyle='rgba(80,180,255,0.3)'; ctx.lineWidth=8;
      ctx.beginPath(); ctx.ellipse(0,-10,34,46,0,0,Math.PI*2); ctx.stroke();
    }
  }
  ctx.shadowBlur=0; ctx.restore();
}

function drawEnemy(key,x,y,fr_,dir,state,fallback,cols){
  ctx.save();ctx.translate(x,y);if(dir===-1)ctx.scale(-1,1);
  if(ok(key)){
    const img=IMGS[key];
    // Detecta columnas: si no se pasan, comprueba si la imagen es casi cuadrada por frame
    // excursionista.png tiene 3 cols, los demás 6
    const COLS=cols||(img.width/img.height>2?6:3);
    const fw=img.width/COLS;
    const rows=Math.max(1,Math.floor(img.height/fw));
    const fh=img.height/rows;
    let col=Math.floor(fr_/6)%COLS,row=0;
    switch(state){
      case 'atk':row=Math.min(2,rows-1);col=Math.floor(fr_/8)%COLS;break;
      case 'spec':row=Math.min(3,rows-1);col=Math.floor(fr_/8)%COLS;break;
      case 'def':row=0;col=0;break;
    }
    col=Math.min(col,COLS-1);row=Math.min(row,rows-1);
    ctx.drawImage(img,col*fw,row*fh,fw,fh,-26,-34,52,70);
  } else fallback(fr_,state);
  ctx.restore();
}

let FX=[],frame=0;
function addFX(x,y,type,col){FX.push({x,y,type,col:col||'#ff0',t:0,max:type==='expl'?28:40});}
function updateFX(){FX=FX.filter(e=>(e.t++)<e.max);}
function drawFX(){FX.forEach(e=>{const p=e.t/e.max;ctx.globalAlpha=(1-p)*.9;
  if(e.type==='hit'){ctx.strokeStyle=e.col;ctx.lineWidth=3;for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*8,e.y+Math.sin(a)*8);ctx.lineTo(e.x+Math.cos(a)*p*55,e.y+Math.sin(a)*p*55);ctx.stroke();}}
  else if(e.type==='rainbow'){['#f00','#f80','#ff0','#0f0','#0af','#a0f'].forEach((c,i)=>{ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,10+i*10+p*42,0,Math.PI*2);ctx.stroke();});}
  else{ctx.fillStyle=`rgba(255,140,0,${(1-p)*.85})`;ctx.beginPath();ctx.arc(e.x,e.y,p*65,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;});}

loadImg('bg','vinedo.png');
loadImg('pan','pan1.png');
loadImg('exc','explor.png');
requestAnimationFrame(loop);

function drawBG(){
  if(ok('bg')){
    const img=IMGS.bg, bx=bgX%W;
    ctx.drawImage(img,-bx,0,W,H-108);          // tile izquierda
    ctx.drawImage(img,W-bx,0,W,H-108);         // tile derecha
    ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(0,0,W,H-108);
  }
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#88c8f0');g.addColorStop(.45,'#f5a020');g.addColorStop(1,'#3a2010');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<7;i++){const vx=((i*70+bgX)%(W+70))-35;fr(vx+3,H-220,7,110,'#4a2810');ctx.fillStyle='#2a6020';ctx.beginPath();ctx.arc(vx+6,H-220,14,0,Math.PI*2);ctx.fill();}}
  const gnd=ctx.createLinearGradient(0,H-118,0,H);gnd.addColorStop(0,'#3a2010');gnd.addColorStop(1,'#1a0a00');ctx.fillStyle=gnd;ctx.fillRect(0,H-118,W,118);ctx.fillStyle='#5a9040';ctx.fillRect(0,H-118,W,4);
}
function drawExcFb(fr_){const t=fr_*.18,b=Math.sin(t)*2,S=2;fr(10*S,-6*S+b,10*S,15*S,'#4d6a34');fr(-6*S,-1*S+b,14*S,12*S,'#5a7a48');fr(-5*S,-8*S+b,11*S,8*S,'#c8956e');fr(-5*S,-8*S+b,11*S,4*S,'#3a2510');fr(-5*S,11*S+b,5*S,9*S,'#486030');fr(2*S,11*S+b,5*S,9*S,'#486030');fr(-9*S,1*S+b,4*S,8*S,'#c8956e');fr(8*S,1*S+b,4*S,8*S,'#c8956e');}
let score=0,bgX=0,bags=0;const BAGS=5;
let p={x:65,y:H-170,hp:100,maxhp:100,en:0,maxen:100,shield:false,scool:0,fr:0,dir:1,state:'run'};
let e={x:W-65,y:55,hp:100,maxhp:100,fr:0,dir:-1,sp:1.8,tcool:80};
let breads=[],items=[],coll=[],win=false,over=false;
for(let i=0;i<3;i++)coll.push({type:'wheat',x:60+Math.random()*(W-120),y:H-235+Math.random()*50,collected:false});
const SHB={x:16,y:H-108,w:108,h:86},FIRE={x:W-128,y:H-108,w:112,h:86};
function update(){if(win||over)return;frame++;p.fr++;e.fr++;bgX=(bgX+.9)%W;
  if(T.down&&T.y<H-115){p.x+=(T.x-22-p.x)*.18;p.x=Math.max(14,Math.min(W-14,p.x));p.state='run';}
  p.shield=dn(SHB.x,SHB.y,SHB.w,SHB.h)&&p.en>0;if(p.shield){p.en=Math.max(0,p.en-.5);p.state='def';}
  if((jd(FIRE.x,FIRE.y,FIRE.w,FIRE.h)||(dn(FIRE.x,FIRE.y,FIRE.w,FIRE.h)&&frame%18===0))&&p.scool<=0){breads.push({x:p.x,y:p.y-30,vy:-10});p.scool=18;p.state='atk';}
  if(p.scool>0){p.scool--;if(p.scool===0)p.state='run';}
  e.x+=e.dir*e.sp;if(e.x<40){e.x=40;e.dir=1;}if(e.x>W-40){e.x=W-40;e.dir=-1;}
  if(--e.tcool<=0){items.push({x:e.x,y:e.y+20,vx:(Math.random()-.5)*7,vy:2+Math.random()*4,type:Math.floor(Math.random()*3),angle:0,spin:(Math.random()-.5)*.25});e.tcool=52+Math.floor(Math.random()*55);}
  if(frame%220===0&&bags<BAGS)coll.push({type:'bag',x:30+Math.random()*(W-60),y:70,vy:2+Math.random()*2,vx:(Math.random()-.5)*3,collected:false});
  if(frame%300===0)coll.push({type:'wheat',x:50+Math.random()*(W-100),y:H-240,collected:false});
  breads=breads.filter(b=>{b.y+=b.vy;if(Math.abs(b.x-e.x)<32&&Math.abs(b.y-e.y)<40){e.hp-=10;score+=50;addFX(e.x,e.y,'hit','#f80');return false;}return b.y>0;});
  items=items.filter(it=>{it.x+=it.vx;it.y+=it.vy;it.angle+=it.spin;it.vy+=.22;if(it.x<10||it.x>W-10)it.vx*=-1;if(it.y>H-140){it.y=H-140;it.vy*=-.6;if(Math.abs(it.vy)<1)it.vy=0;}if(!p.shield&&Math.abs(it.x-p.x)<26&&Math.abs(it.y-p.y)<38){p.hp-=6;addFX(p.x,p.y,'hit','#f00');return false;}return true;});
  coll.forEach(c=>{if(c.collected)return;if(c.type==='bag'){c.y+=c.vy;c.x+=c.vx;c.vy+=.12;if(c.x<10||c.x>W-10)c.vx*=-1;if(c.y>H-140){c.y=H-140;c.vy=0;c.vx=0;}}if(Math.abs(c.x-p.x)<30&&Math.abs(c.y-p.y)<38){c.collected=true;if(c.type==='bag'){bags++;score+=150;addFX(c.x,c.y,'hit','#ffd700');}else{p.en=Math.min(100,p.en+32);addFX(c.x,c.y,'hit','#ffd700');}}});
  coll=coll.filter(c=>!c.collected);updateFX();
  if(bags>=BAGS||e.hp<=0){win=true;score+=600;}if(p.hp<=0)over=true;
}
function draw(){ctx.clearRect(0,0,W,H);drawBG();
  items.forEach(it=>{ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.angle);if(it.type===0){fr(-9,-5,18,11,'#667755');sr(-9,-5,18,11,'#aaa',1);}else if(it.type===1){ctx.strokeStyle='#aaa';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,10,6,0,0,Math.PI*2);ctx.stroke();}else{ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(0,0,10,Math.PI,0);ctx.fill();}ctx.restore();});
  coll.forEach(c=>{if(!c.collected){if(c.type==='wheat')drawWheat(c.x,c.y);else drawBag(c.x,c.y);}});
  breads.forEach(b=>drawBread(b.x,b.y,9));
  // Moto (solo el vehículo, sin el conductor)
  ctx.save();ctx.translate(e.x,e.y);if(e.dir===1)ctx.scale(-1,1);
  fr(-30,5,60,18,'#2a2a2a');fr(-22,3,44,7,'#444');
  ctx.fillStyle='#777';for(const ax of[-20,20]){ctx.beginPath();ctx.arc(ax,24,11,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#333';for(const ax of[-20,20]){ctx.beginPath();ctx.arc(ax,24,6,0,Math.PI*2);ctx.fill();}
  // Escape de humo
  if(frame%10<5){ctx.fillStyle='rgba(200,200,200,0.35)';ctx.beginPath();ctx.arc(e.dir===1?-30:-(-30),18,7,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  // Conductor (excursionista) encima de la moto, 3 columnas en su sprite
  drawEnemy('exc',e.x,e.y-28,e.fr,e.dir,'idle',drawExcFb,3);
  drawPan(p.x,p.y,p.fr,p.dir,p.shield,p.state);
  if(p.shield&&p.en<20&&frame%6<3){ctx.fillStyle='rgba(80,150,255,0.18)';ctx.fillRect(0,0,W,H);}
  drawFX();
  bar(8,8,148,24,p.hp,p.maxhp,'#00dd00');txt('HP',14,26,7,'#aaffaa');
  bar(8,36,148,14,p.en,p.maxen,'#22aaff');txt('EN',14,47,6,'#aae0ff');
  bar(W-156,8,148,22,e.hp,e.maxhp,'#f80');txt('EXCURSIONISTA',W-154,25,5,'#ffcc88');
  txts(Array.from({length:BAGS},(_,i)=>i<bags?'■':'□').join(' '),W/2,52,10,'#ffd700');
  txts('PUNTOS: '+score,W/2,28,7,'#fff');txts('BOLSOS '+bags+'/'+BAGS,W/2,70,6,'#ffaa44');
  ctx.globalAlpha=.9;btn(SHB.x,SHB.y,SHB.w,SHB.h,'ESCUDO','#112288');btn(FIRE.x,FIRE.y,FIRE.w,FIRE.h,'LANZAR','#774400');ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(SHB.x+SHB.w+4,H-108,W-SHB.w-FIRE.w-28,86);txts('ARRASTRA PARA MOVERTE',W/2,H-62,6,'rgba(255,255,255,0.4)');
  if(win){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);ctx.shadowColor='#ffd700';ctx.shadowBlur=18;txts('NIVEL SUPERADO!',W/2,H/2-55,13,'#ffd700');ctx.shadowBlur=0;txts('BOLSOS: '+bags+'/'+BAGS,W/2,H/2-8,8,'#fff');txts('PUNTOS: '+score,W/2,H/2+22,9,'#ffd700');txts('A POR EL BOSS!',W/2,H/2+55,8,'#0f8');}
  if(over){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);txts('GAME OVER',W/2,H/2-50,13,'#e33');txts('PUNTOS: '+score,W/2,H/2,9,'#ffd700');}
}
function loop(){
  // Pantalla de carga mientras llegan los assets
  if(!ok('pan') || !ok('bg')){
    ctx.fillStyle='#0a0010';ctx.fillRect(0,0,W,H);
    ctx.font=gf(10);ctx.fillStyle='#ffd700';ctx.textAlign='center';
    ctx.fillText('EL PANIFICADOR',W/2,H/2-40);
    ctx.font=gf(7);ctx.fillStyle='#888';
    ctx.fillText('CARGANDO ASSETS...',W/2,H/2);
    // Barra de progreso animada
    const bw=200,bx=W/2-100,by=H/2+20;
    ctx.fillStyle='#222';ctx.fillRect(bx,by,bw,12);
    const prog=((frame*3)%bw);
    ctx.fillStyle='#ffd700';ctx.fillRect(bx,by,prog,12);
    ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,12);
    ctx.fillStyle='#444';ctx.font=gf(6);
    ctx.fillText('pan:' +(ok('pan')?'✓':'…')+' bg:'+(ok('bg')?'✓':'…')+' exc:'+(ok('exc')?'✓':'…'),W/2,H/2+50);
    frame++;_jd=false;requestAnimationFrame(loop);return;
  }
  update();draw();_jd=false;requestAnimationFrame(loop);
}
</script></body></html>
