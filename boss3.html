<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BOSS FINAL — Doña Dolores</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none;}
#info{color:#0f8;font:bold 11px monospace;padding:4px;background:#040010;width:100%;text-align:center;}
canvas{display:block;image-rendering:pixelated;}
</style>
</head>
<body>
<div id="info">COMBATE FINAL — Doña Dolores 💜</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const BASE_W=390,BASE_H=680;let scale=1;
function resize(){const ih=window.innerHeight-24;scale=Math.min(window.innerWidth/BASE_W,ih/BASE_H);C.style.width=(BASE_W*scale)+'px';C.style.height=(BASE_H*scale)+'px';C.width=BASE_W;C.height=BASE_H;}
resize();window.addEventListener('resize',resize);
const W=BASE_W,H=BASE_H;

const RAW='https://raw.githubusercontent.com/fgtgarciatorres-byte/pandrama/main/';
const IMGS={};
function loadImg(k,p){const i=new Image();i.crossOrigin='anonymous';i.src=RAW+p;IMGS[k]=i;}
loadImg('bg','assets/bg/cyberpunk.png');
loadImg('pan','assets/sprites/panificador_run.png');
loadImg('dol','assets/sprites/dona_dolores.png');

const T={x:0,y:0,down:false};let _jd=false;
function gp(e,i=0){const r=C.getBoundingClientRect(),s=e.changedTouches?e.changedTouches[i]:e;return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=gp(e);T.x=p.x;T.y=p.y;T.down=true;_jd=true;},{passive:false});
C.addEventListener('touchend',  e=>{e.preventDefault();T.down=false;},{passive:false});
C.addEventListener('touchmove', e=>{e.preventDefault();const p=gp(e);T.x=p.x;T.y=p.y;},{passive:false});
C.addEventListener('mousedown', e=>{const p=gp(e);T.x=p.x;T.y=p.y;T.down=true;_jd=true;});
C.addEventListener('mouseup',   ()=>T.down=false);
C.addEventListener('mousemove', e=>{if(T.down){const p=gp(e);T.x=p.x;T.y=p.y;}});
function jd(x,y,w,h){return _jd&&T.x>=x&&T.x<=x+w&&T.y>=y&&T.y<=y+h;}
function dn(x,y,w,h){return T.down&&T.x>=x&&T.x<=x+w&&T.y>=y&&T.y<=y+h;}

function fr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function sr(x,y,w,h,c,lw=1.5){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}
function txt(s,x,y,sz,c,al='left'){ctx.font=`bold ${sz}px monospace`;ctx.fillStyle=c;ctx.textAlign=al;ctx.fillText(s,x,y);}
function txts(s,x,y,sz,c,sh='#000'){ctx.font=`bold ${sz}px monospace`;ctx.textAlign='center';ctx.fillStyle=sh;ctx.fillText(s,x+2,y+2);ctx.fillStyle=c;ctx.fillText(s,x,y);}
function bar(x,y,w,h,v,mx,c,bg='#1a1a1a'){ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);ctx.fillStyle=c;ctx.fillRect(x+1,y+1,Math.max(0,Math.floor((w-2)*v/mx)),h-2);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);}
function btn(x,y,w,h,lbl,bg='#223'){ctx.fillStyle='#000';ctx.fillRect(x+2,y+2,w,h);ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);ctx.font='bold 12px monospace';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(lbl,x+w/2,y+h/2+5);}

// ── SPRITES ──────────────────────────────────────────────────
function drawPanC(x,y,fr_,dir=1,atk=false,def=false){
  ctx.save();ctx.translate(x,y);if(dir===-1)ctx.scale(-1,1);
  const t=fr_*.25,bob=Math.sin(t)*2;
  ctx.fillStyle='#1a8fff';ctx.beginPath();ctx.moveTo(6,6+bob);ctx.lineTo(-4,28+bob+Math.sin(t)*5);ctx.lineTo(18,20+bob);ctx.closePath();ctx.fill();
  fr(-11,3+bob,28,22,'#1144bb');fr(-9,5+bob,24,14,'#2266dd');fr(-4,7+bob,9,5,'#ffd700');
  fr(-8,-11+bob,22,16,'#c8956e');fr(-8,-11+bob,22,6,'#1a0800');
  fr(-4,-5+bob,4,3,'#fff');fr(7,-5+bob,4,3,'#fff');fr(-3,-4+bob,2,2,'#000');fr(8,-4+bob,2,2,'#000');
  const ls=Math.sin(t)*5;fr(-9,25+bob,10,16,'#0033aa');fr(4,25+bob-ls,10,16,'#0033aa');
  if(atk){fr(-16,6+bob,8,10,'#c8956e');fr(16,4+bob,8,18,'#c8956e');}
  else if(def){fr(-16,4+bob,8,20,'#4af');ctx.strokeStyle='rgba(80,160,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-12,14+bob,8,14,0,0,Math.PI*2);ctx.stroke();fr(16,6+bob,8,16,'#c8956e');}
  else{fr(-16,6+bob,8,16,'#c8956e');fr(16,6+bob,8,16,'#c8956e');}
  ctx.restore();
}

function drawDoloresC(x,y,fr_,spec=false){
  ctx.save();ctx.translate(x,y);ctx.scale(-1,1);
  const t=fr_*.25,bob=Math.sin(t)*2;
  // Cape
  ctx.fillStyle='rgba(0,110,0,0.88)';ctx.beginPath();ctx.moveTo(2,0+bob);ctx.lineTo(-30,34+bob+Math.sin(t)*7);ctx.lineTo(24,26+bob);ctx.closePath();ctx.fill();
  // Suit
  fr(-13,-6+bob,30,38,'#7700aa');fr(-11,-4+bob,26,32,'#9900cc');
  // G neon badge
  ctx.shadowColor='#00ff88';ctx.shadowBlur=8;
  ctx.font='bold 14px monospace';ctx.fillStyle='#00ff88';ctx.textAlign='center';ctx.fillText('G',4,14+bob);
  ctx.shadowBlur=0;
  // Mech arm (right side = attack)
  if(spec){ctx.shadowColor='#00ff88';ctx.shadowBlur=12;}
  fr(14,4+bob,22,7,'#444');fr(34,2+bob,10,14,'#555');sr(14,4+bob,22,7,'#00ff88',1);
  ctx.shadowBlur=0;
  // Head
  fr(-10,-24+bob,22,20,'#c8956e');fr(-10,-24+bob,22,8,'#ddd');
  fr(-5,-30+bob,12,10,'#ccc');
  fr(-6,-17+bob,4,3,'rgba(150,255,0,0.9)');fr(5,-17+bob,4,3,'rgba(150,255,0,0.9)');
  // Handbag
  fr(-22,20+bob,20,18,'#7a3a10');sr(-22,20+bob,20,18,'#ffd700',1);
  ctx.font='bold 9px monospace';ctx.fillStyle='#ffd700';ctx.textAlign='center';ctx.fillText('G',-11,32+bob);
  // Tornado special attack
  if(spec){
    for(let i=0;i<5;i++){
      ctx.strokeStyle=`rgba(0,255,130,${(5-i)/5*.5})`;ctx.lineWidth=2+i*.5;
      ctx.beginPath();ctx.arc(0,10+bob,20+i*16+Math.sin(t+i)*5,0,Math.PI*2);ctx.stroke();
    }
    // Flying handbag items
    for(let i=0;i<4;i++){
      const ang=t*2+i*Math.PI/2;const r=30+i*10;
      ctx.fillStyle='#ffd700';
      ctx.beginPath();ctx.arc(Math.cos(ang)*r,10+bob+Math.sin(ang)*r*.6,4,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function drawChar(key,x,y,fr_,dir,atk,def,spec,fallback){
  const img=IMGS[key];
  if(img&&img.complete&&img.naturalWidth>0){
    const frames=6,fw=img.width/frames,frame=fr_%frames|0;
    ctx.save();ctx.translate(x,y);if(dir===-1)ctx.scale(-1,1);
    ctx.drawImage(img,frame*fw,0,fw,img.height/2,-24,-24,48,58);
    ctx.restore();
  } else fallback();
}

// FX
let FX=[];
function addFX(x,y,type,col='#ff0'){FX.push({x,y,type,col,t:0,max:42});}
function updateFX(){FX=FX.filter(e=>(e.t++)<e.max);}
function drawFX(){
  FX.forEach(e=>{
    const p=e.t/e.max;ctx.globalAlpha=(1-p)*.9;
    if(e.type==='hit'){ctx.strokeStyle=e.col;ctx.lineWidth=3;for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*8,e.y+Math.sin(a)*8);ctx.lineTo(e.x+Math.cos(a)*p*55,e.y+Math.sin(a)*p*55);ctx.stroke();}}
    else{['#f00','#f80','#ff0','#0f0','#0af','#a0f'].forEach((c,i)=>{ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,10+i*10+p*42,0,Math.PI*2);ctx.stroke();});}
    ctx.globalAlpha=1;
  });
}

// ── GAME STATE ───────────────────────────────────────────────
let frame=0,score=0;
let plr={x:80,y:H-230,hp:100,maxhp:100,en:60,maxen:100,fr:0,dir:1,state:'idle',st:0};
let boss={x:W-100,y:H-230,hp:220,maxhp:220,fr:0,dir:-1,state:'idle',st:0,at:90};
let msg='',mgt=0,result=null;

const LFT={x:8,y:H-125,w:78,h:60};
const RGT={x:90,y:H-125,w:78,h:60};
const ATK={x:W-140,y:H-192,w:132,h:64};
const DEF={x:W-140,y:H-124,w:132,h:60};
const SPC={x:8,y:H-192,w:160,h:64};

function setMsg(m,d=35){msg=m;mgt=d;}

function update(){
  if(result) return;
  frame++;plr.fr++;boss.fr++;

  if(dn(LFT.x,LFT.y,LFT.w,LFT.h)){plr.x=Math.max(20,plr.x-3.5);plr.dir=-1;}
  if(dn(RGT.x,RGT.y,RGT.w,RGT.h)){plr.x=Math.min(boss.x-62,plr.x+3.5);plr.dir=1;}

  if(jd(ATK.x,ATK.y,ATK.w,ATK.h)&&plr.state==='idle'){
    plr.state='atk';plr.st=28;
    if(Math.abs(plr.x-boss.x)<120&&boss.state!=='def'){boss.hp-=14;score+=100;addFX(boss.x,boss.y,'hit','#f80');setMsg('¡GOLPE!');}
    else setMsg(boss.state==='def'?'¡Bloqueado con el bolso!':'¡Muy lejos!');
  }
  if(dn(DEF.x,DEF.y,DEF.w,DEF.h)) plr.state='def';
  if(jd(SPC.x,SPC.y,SPC.w,SPC.h)&&plr.en>=30&&plr.state==='idle'){
    plr.state='spec';plr.st=50;plr.en-=30;
    boss.hp-=36;score+=250;addFX(boss.x,boss.y,'rainbow');setMsg('🌈 ¡TORMENTA DE PAN!',50);
  } else if(jd(SPC.x,SPC.y,SPC.w,SPC.h)&&plr.en<30) setMsg('¡Sin energía!',22);
  if(plr.st>0){plr.st--;if(plr.st===0)plr.state='idle';}

  // Boss Dolores — most aggressive
  boss.at--;
  if(boss.at<=0){
    const r=Math.random();
    if(r<0.4){
      boss.state='atk';boss.st=28;boss.at=74+Math.random()*28;
      if(Math.abs(plr.x-boss.x)<132&&plr.state!=='def'){plr.hp-=17;addFX(plr.x,plr.y,'hit','#f00');setMsg('💜 ¡Puñetazo Neon!');}
      else if(plr.state==='def') plr.hp-=5;
    } else if(r<0.68){
      boss.state='spec';boss.st=55;boss.at=125;
      if(plr.state!=='def'){plr.hp-=38;addFX(plr.x,plr.y,'rainbow');setMsg('🌀 ¡TORBELLINO DE BOLSOS!',55);}
      else plr.hp-=12;
    } else {boss.state='def';boss.st=40;boss.at=60;}
  }
  if(boss.st>0){boss.st--;if(boss.st===0)boss.state='idle';}
  if(mgt>0)mgt--;
  if(frame%36===0&&plr.en<100) plr.en=Math.min(100,plr.en+6);
  updateFX();
  if(boss.hp<=0){result='win';score+=1500;}
  if(plr.hp<=0) result='lose';
}

function drawBG(){
  const bg=IMGS.bg;
  if(bg&&bg.complete&&bg.naturalWidth>0){
    ctx.drawImage(bg,0,0,W,H-140);
    ctx.fillStyle='rgba(5,0,20,0.52)';ctx.fillRect(0,0,W,H-140);
  } else {
    ctx.fillStyle='#040010';ctx.fillRect(0,0,W,H);
    // Buildings
    [[0,58,280,'#0a0820'],[W-62,62,310,'#0a0820']].forEach(([bx,bw,bh,bc])=>{
      fr(bx,H-148-bh,bw,bh,bc);
      for(let r2=0;r2<9;r2++) for(let cc=0;cc<4;cc++){
        const wx=bx+8+cc*14,wy=H-148-bh+8+r2*28;
        if((r2+cc+(frame/22|0))%3!==0){
          const nc=['#0f8','#f0f','#0ff','#ff0'][(r2*4+cc)%4];
          ctx.fillStyle=nc;ctx.shadowColor=nc;ctx.shadowBlur=6;ctx.fillRect(wx,wy,11,9);ctx.shadowBlur=0;
        }
      }
    });
  }
  // Rain
  ctx.strokeStyle='rgba(100,140,255,0.28)';ctx.lineWidth=1;
  for(let i=0;i<28;i++){const rx=(i*73+frame*4)%W,ry=(i*51+frame*6)%H;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+14);ctx.stroke();}
  // Neon puddles
  fr(0,H-148,W,148,'#06020e');fr(0,H-148,W,10,'#140830');
  ctx.fillStyle='rgba(40,10,70,0.5)';ctx.fillRect(0,H-142,W,30);
  // Neon reflections on ground
  ['#f0f','#0ff','#0f8'].forEach((c,i)=>{
    ctx.fillStyle=`rgba(${c==='#f0f'?'255,0,255':c==='#0ff'?'0,255,255':'0,255,130'},0.08)`;
    ctx.fillRect(30+i*100,H-142,80,28);
  });
}

function draw(){
  drawBG();

  // Neon sign
  ctx.shadowColor='#ff00ff';ctx.shadowBlur=18;
  txts('⚔ COMBATE FINAL',W/2,48,19,'#ff00ff');
  ctx.shadowBlur=0;
  ctx.shadowColor='#00ff88';ctx.shadowBlur=10;
  txts('VS DOÑA DOLORES',W/2,74,13,'#00ff88');
  ctx.shadowBlur=0;

  drawChar('pan',plr.x,plr.y,plr.fr,plr.dir,plr.state==='atk',plr.state==='def',false,
    ()=>drawPanC(plr.x,plr.y,plr.fr,plr.dir,plr.state==='atk',plr.state==='def'));
  drawChar('dol',boss.x,boss.y,boss.fr,-1,boss.state==='atk',boss.state==='def',boss.state==='spec',
    ()=>drawDoloresC(boss.x,boss.y,boss.fr,boss.state==='spec'));

  // Special overlay for Dolores spec
  if(boss.state==='spec'){
    ctx.strokeStyle='rgba(0,255,130,0.4)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(boss.x,boss.y+10,52,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(130,0,255,0.25)';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(boss.x,boss.y+10,68,0,Math.PI*2);ctx.stroke();
  }
  if(boss.state==='def'){ctx.strokeStyle='rgba(0,200,100,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(boss.x,boss.y+10,36,48,0,0,Math.PI*2);ctx.stroke();}

  drawFX();

  // HUD
  bar(8,85,155,24,plr.hp,plr.maxhp,'#00cc00');txt('P',12,103,14,'#0f0');
  bar(W-163,85,155,24,boss.hp,boss.maxhp,'#f44');
  ctx.shadowColor='#ff00ff';ctx.shadowBlur=5;txt('DOLORES',W-160,103,9,'#f0f');ctx.shadowBlur=0;
  bar(8,114,155,14,plr.en,plr.maxen,'#22aaff');
  txts(`PUNTOS: ${score}`,W/2,75,11,'#fff');
  if(mgt>0){ctx.globalAlpha=Math.min(1,mgt/15);txts(msg,W/2,H/2-80,17,'#ffd700');ctx.globalAlpha=1;}

  ctx.globalAlpha=.88;
  btn(LFT.x,LFT.y,LFT.w,LFT.h,'◀','#223');
  btn(RGT.x,RGT.y,RGT.w,RGT.h,'▶','#223');
  btn(ATK.x,ATK.y,ATK.w,ATK.h,'⚔ ATAQUE','#8B0000');
  btn(DEF.x,DEF.y,DEF.w,DEF.h,'🛡 DEFENSA','#003388');
  btn(SPC.x,SPC.y,SPC.w,SPC.h,'🌈 ESPECIAL','#550088');
  ctx.globalAlpha=1;
  txts(`⚡ ${Math.floor(plr.en)}/100`,SPC.x+SPC.w/2,SPC.y+SPC.h+14,10,plr.en>=30?'#aaf':'#844');

  // HP warning
  if(plr.hp<30&&frame%18<9){txts('⚠ VIDA BAJA',W/2,H/2-40,14,'#f44');}

  if(result){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    if(result==='win'){
      // Celebrate!
      ['#f00','#f80','#ff0','#0f0','#0af','#a0f'].forEach((c,i)=>{
        ctx.fillStyle=c;
        for(let j=0;j<3;j++) ctx.fillRect((i*80+j*22+frame*3)%W,(frame*(i+1)*.8+j*120)%H,8,8);
      });
      ctx.shadowColor='#ffd700';ctx.shadowBlur=20;
      txts('¡¡VICTORIA TOTAL!!',W/2,H/2-80,24,'#ffd700');ctx.shadowBlur=0;
      txts('¡Has salvado la Masa!',W/2,H/2-40,16,'#fff');
      txts('La Panadería está a salvo',W/2,H/2-12,13,'#0f8');
      txts(`Puntuación final: ${score}`,W/2,H/2+28,18,'#ffd700');
      txts('© Panadería Pixel Estudios',W/2,H/2+60,10,'#555');
    } else {
      txts('DERROTA',W/2,H/2-60,32,'#e33');
      txts('Doña Dolores controla la Masa...',W/2,H/2,13,'#f88');
      txts(`Puntos: ${score}`,W/2,H/2+35,17,'#ffd700');
    }
    txts('Recarga para reintentar',W/2,H/2+85,11,'#aaa');
  }
}

function loop(){update();ctx.clearRect(0,0,W,H);draw();_jd=false;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
